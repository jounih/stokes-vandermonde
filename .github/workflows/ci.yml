name: Build and check axioms
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Check for escape hatches
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE '\b(sorry|sorry_using|axiom|native_decide|implemented_by)\b|@\[extern' PakPrimes/ PakPrimes.lean PNTIntegration/ Statements/ PakStokes/ PakStokesAllD.lean vendor/PrimeNumberTheoremAnd/ vendor/pak-cubic-theta/; then
            echo "Forbidden escape hatch found"
            exit 1
          fi
      - name: Verify theorems and axiom lists
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Verify.lean | tee verify.log
          python3 - <<'PY'
          import re
          text = open("verify.log").read()
          flat = re.sub(r"\s+", " ", text)
          expected = [
              "PakPrimes.GeneralTheorem2.borel_stokes_vandermonde_no_autonomous_ade",
              "PakPrimes.GeneralTheorem2.no_autonomous_ade_of_meromorphic_borel",
              "PakPrimes.GeneralTheorem2.gHat_no_autonomous_ade_via_general_theorem_2",
              "PakPrimes.BorelStokesVandermonde.gHat_no_autonomous_ade",
