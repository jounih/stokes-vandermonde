name: Build and check axioms
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Check for escape hatches
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE '\b(sorry|sorry_using|axiom|native_decide|implemented_by)\b|@\[extern' PakPrimes/ PakPrimes.lean PNTIntegration/ Statements/ vendor/PrimeNumberTheoremAnd/; then
            echo "Forbidden escape hatch found"
            exit 1
          fi
      - name: Verify theorems and axiom lists
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Verify.lean | tee verify.log
          python3 - <<'PY'
          import re
          text = open("verify.log").read()
          flat = re.sub(r"\s+", " ", text)
          expected = [
              "PakPrimes.GeneralTheorem2.borel_stokes_vandermonde_no_autonomous_ade",
              "PakPrimes.GeneralTheorem2.no_autonomous_ade_of_meromorphic_borel",
              "PakPrimes.GeneralTheorem2.gHat_no_autonomous_ade_via_general_theorem_2",
              "PakPrimes.BorelStokesVandermonde.gHat_no_autonomous_ade",
              "PakPrimes.Main.logReciprocal_algebraicIndependent",
              "PakPrimes.Main.pak_conjecture_2_5b_of_pnt",
              "MediumPNT",
              "PakPrimes.Main.pntAllOrders",
              "PakPrimes.Main.primeCounting_and_indicator_independent",
              "PakPrimes.Main.primeCounting_and_indicator_no_polynomialADE",
              "PakPrimes.Main.primeCounting_and_indicator_no_rationalADE",
              "PakPrimes.HigherOrderStokes.higher_order_stokes_vandermonde_no_ade",
              "PakPrimes.HigherOrderStokes.higher_order_stokes_vandermonde_no_rat_ade",
              "PakPrimes.HigherOrderStokes.no_rat_ade_of_higher_order_borel",
              "PakPrimes.HolderGamma.trigamma_no_rat_ade",
              "PakPrimes.HolderGamma.holder_gamma_no_ade",
              "PakPrimes.HolderGamma.holder_gamma_no_rat_ade",
              "PakPrimes.HolderGamma.holder_realGamma_no_ade",
              "PakPrimes.OstrowskiZeta.ostrowski_riemannZeta_no_complex_ade",
              "PakPrimes.OstrowskiZeta.ostrowski_riemannZeta_no_ade",
              "PakPrimes.OstrowskiZeta.ostrowski_riemannZeta_no_rat_ade",
              "PakPrimes.DivisorAndMacMahon.sigmaEvenSeries_algebraicIndependent",
              "PakPrimes.DivisorAndMacMahon.divisorSeries_algebraicIndependent",
              "PakPrimes.DivisorAndMacMahon.macmahonSeries_algebraicIndependent",
              "PakPrimes.DivisorAndMacMahon.hasProd_macmahonEulerProduct",
              "PakPrimes.DivisorAndMacMahon.macmahonEulerProduct_algebraicIndependent",
              "PakPrimes.PakYeliussizovEGF.ogf_algebraicIndependent_of_higherOrderBorel",
              "PakPrimes.PakYeliussizovEGF.bernOGF_algebraicIndependent",
              "PakPrimes.PakYeliussizovEGF.tanOGF_algebraicIndependent",
              "PakPrimes.PakYeliussizovEGF.secOGF_algebraicIndependent",
              "PakPrimes.PakYeliussizovEGF.sec2OGF_algebraicIndependent",
              "PakPrimes.PakYeliussizovEGF.ratExpOGF_algebraicIndependent",
              "PakPrimes.PartitionsIntoPrimes.hasProd_partitionPrimesEulerProduct",
              "PakPrimes.PartitionsIntoPrimes.hasProd_distinctPrimesEulerProduct",
              "PakPrimes.PartitionsIntoPrimes.partLogDeriv_algebraicIndependent",
              "PakPrimes.PartitionsIntoPrimes.partitionPrimes_algebraicIndependent",
              "PakPrimes.PartitionsIntoPrimes.partitionPrimesEulerProduct_algebraicIndependent",
              "PakPrimes.PartitionsIntoPrimes.distinctLogDeriv_algebraicIndependent",
              "PakPrimes.PartitionsIntoPrimes.distinctPrimes_algebraicIndependent",
              "PakPrimes.PartitionsIntoPrimes.distinctPrimesEulerProduct_algebraicIndependent",
              "PakPrimes.MockModularWeightOne.eichlerWeightOne_no_rat_ade",
              "PakPrimes.MockModularWeightOne.eichlerWeightOne_integral_no_rat_ade",
              "PakPrimes.MockModularWeightOne.kryEisenstein_no_rat_ade",
              "PakPrimes.MockModularWeightOne.cuspG23_no_rat_ade",
              "Statements.QuasipolynomialParity.quasipoly_lambert_pure_dTrans",
              "Statements.QuasipolynomialParity.quasipoly_lambert_eventually_dTrans",
              "Statements.QuasipolynomialParity.quasipoly_eulerProduct_eventually_dTrans",
              "Statements.QuasipolynomialParity.quasipoly_bose_eventually_dTrans",
              "Statements.QuasipolynomialParity.partsMod5One_dTrans",
              "Statements.QuasipolynomialParity.period1_lambert_iff",
              "Statements.QuasipolynomialParity.period1_eulerProduct_iff",
              "Statements.QuasipolynomialParity.period2_lambert_iff",
              "Statements.QuasipolynomialParity.period2_eulerProduct_iff",
              "Statements.QuasipolynomialParity.macMahon_partsMod5One_partsMod5Two_joint_dIndep",
              "Statements.QuasipolynomialParity.conformalScalar_allDim_sphere_iff",
              "Statements.ThermalGasAndSpheres.ideal_gas_dimensional_parity",
              "Statements.ThermalGasAndSpheres.bose_eos_3D_dTrans",
              "Statements.ThermalGasAndSpheres.fermi_eos_3D_dTrans",
              "Statements.ThermalGasAndSpheres.casimir_2D_dAlgebraic",
              "Statements.ThermalGasAndSpheres.casimir_1D_dTrans",
              "Statements.ThermalGasAndSpheres.casimir_3D_dTrans",
              "Statements.ThermalGasAndSpheres.conformalScalar_sphere_allDim_iff",
              "PakPrimes.ThermalGasEOS.boseEOS1D_no_rat_ade",
              "PakPrimes.ThermalGasEOS.fermiEOS1D_no_rat_ade",
              "PakPrimes.ThermalGasEOS.casimirForce2D_dAlgebraic",
              "PakPrimes.ThermalGasEOS.casimirEnergy2D_dAlgebraic",
              "PakPrimes.ThermalGasEOS.casimir1D_no_rat_ade",
              "PakPrimes.ThermalGasEOS.conformalScalar_sphere_parity",
              "Statements.MordellAndFalseThetaIntegrals.mockThetaF_mordell_dTrans",
              "Statements.MordellAndFalseThetaIntegrals.mockThetaOmega_mordell_dTrans",
              "Statements.MordellAndFalseThetaIntegrals.hurwitz_eichler_shadow_dTrans",
              "Statements.MordellAndFalseThetaIntegrals.falseThetaSinh_mordell_dTrans",
              "Statements.MordellAndFalseThetaIntegrals.kontsevich_mordell_dTrans",
              "Statements.MordellAndFalseThetaIntegrals.rogers_stieltjes_dTrans",
              "Statements.MordellAndFalseThetaIntegrals.five_mordell_joint_dIndep",
              "Statements.PrimesAndClassical.primeCounting_and_indicator_dTrans",
              "Statements.PrimesAndClassical.partitionPrimes_eulerProduct_dTrans",
              "Statements.PrimesAndClassical.distinctPrimes_eulerProduct_dTrans",
              "Statements.PrimesAndClassical.macmahon_eulerProduct_dTrans",
              "Statements.PrimesAndClassical.holder_gamma_dTrans",
              "Statements.PrimesAndClassical.ostrowski_riemannZeta_dTrans",
          ]
          for thm in expected:
              needle = f"'{thm}' depends on axioms: [propext, Classical.choice, Quot.sound]"
              assert needle in flat, f"Missing exact axiom line: {needle}"
          # Purely algebraic Chazy ODE uses zero axioms
          chazy_line = "'Statements.MordellAndFalseThetaIntegrals.chazy_ode_from_ramanujan' does not depend on any axioms"
          assert chazy_line in flat or "'Statements.MordellAndFalseThetaIntegrals.chazy_ode_from_ramanujan' depends on axioms: [propext, Classical.choice, Quot.sound]" in flat, "Missing Chazy ODE axiom line"
          for bad in ("sorryAx", "Lean.ofReduceBool", "Lean.trustCompiler"):
              assert bad not in text, f"Forbidden axiom present: {bad}"
          print(f"Verified all {len(expected) + 1} declarations with strictly standard axioms.")
          PY
      - name: Independent kernel check (leanchecker)
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s unlimited
          # Fresh kernel replays covering 100% of the v3.0.0 transitive closure (split to bound stack & RAM on x86_64)
          echo "=== leanchecker --fresh Statements.PrimesAndClassical (Wave 1-2 + PNT+) ==="
          lake env leanchecker --fresh Statements.PrimesAndClassical
          echo "=== leanchecker --fresh Statements.QuasipolynomialParity (All 7 Wave 3 proof modules) ==="
          lake env leanchecker --fresh Statements.QuasipolynomialParity
          # Direct module checks on every v3.0.0 statement spec and proof root
          for mod in \
            PNTIntegration.PrimeCountingFromPsi PNTIntegration.Final PNTIntegration.ExplicitADE \
            PNTIntegration.ExplicitRat PNTIntegration.PrimePartitions PakPrimes \
            PakPrimes.HigherOrderStokes PakPrimes.HolderGamma PakPrimes.OstrowskiZeta \
            PakPrimes.DivisorAndMacMahon PakPrimes.MacMahonEulerProduct \
            PakPrimes.PakYeliussizovEGF PakPrimes.PartitionsIntoPrimes \
            PakPrimes.PrimeEulerProduct PakPrimes.MockModularWeightOne \
            PakPrimes.HarmonicTrapShift PakPrimes.QuasipolynomialEulerParity \
            PakPrimes.ThermalGasParity PakPrimes.ThermalGasEOS \
            PakPrimes.MockThetaAndHurwitz PakPrimes.FalseThetaDichotomy \
            PakPrimes.QuasipolynomialIFF \
            Statements.QuasipolynomialParity Statements.ThermalGasAndSpheres \
            Statements.MordellAndFalseThetaIntegrals Statements.PrimesAndClassical \
            Statements.All; do
            echo "Checking $mod..."
            lake env leanchecker "$mod"
          done
