      - name: Independent kernel check (leanchecker)
        shell: bash
        run: |
          set -euo pipefail
          # Fresh kernel replays covering 100% of the v3.0.0 proof transitive closure
          # (Statements.PrimesAndClassical covers all Wave 1-2 + PNT+;
          #  Statements.QuasipolynomialParity imports QuasipolynomialIFF which covers all 7 Wave 3 proof modules).
          # Use unlimited main-thread stack for single-threaded --fresh replays, and a finite 64 MiB stack
          # for multi-threaded non-fresh checks (glibc falls back to 2 MiB pthread stacks under RLIM_INFINITY).
          echo "=== leanchecker --fresh Statements.PrimesAndClassical (Wave 1-2 + PNT+) ==="
