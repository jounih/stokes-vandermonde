name = "pak_primes_2_5b"
version = "2.0.0"
defaultTargets = ["PakPrimes", "PNTIntegration"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "PakPrimes"
roots = [
  "PakPrimes",
  "PakPrimes.BorelStokesVandermonde",
  "PakPrimes.AutonomousTransfer",
  "PakPrimes.MainTheorem",
  "PakPrimes.GeneralTheorem2",
  "PakPrimes.HigherOrderStokes",
  "PakPrimes.HolderGamma",
  "PakPrimes.OstrowskiZeta",
  "PakPrimes.DivisorAndMacMahon",
  "PakPrimes.MacMahonLogCoefficients",
  "PakPrimes.MacMahonEulerFactors",
  "PakPrimes.MacMahonEulerProduct",
  "PakPrimes.PakYeliussizovEGF",
  "PakPrimes.PartitionsIntoPrimes",
  "PakPrimes.PrimeEulerProduct",
  "PakPrimes.MockModularWeightOne"
]

[[lean_lib]]
name = "PNTIntegration"
roots = [
  "PNTIntegration.Final",
  "PNTIntegration.PrimeCountingFromPsi",
  "PNTIntegration.ExplicitADE",
  "PNTIntegration.ExplicitRat",
  "PNTIntegration.PrimePartitions"
]

[[lean_lib]]
name = "Architect"
srcDir = "vendor"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
srcDir = "vendor"

[lean_lib.leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
