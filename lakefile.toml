name = "pak_primes_2_5b"
version = "1.1.0"
defaultTargets = ["PakPrimes"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "PakPrimes"
roots = ["PakPrimes", "PakPrimes.BorelStokesVandermonde", "PakPrimes.AutonomousTransfer", "PakPrimes.MainTheorem", "PakPrimes.GeneralTheorem2"]

[[lean_lib]]
name = "PNTIntegration"
roots = ["PNTIntegration.Final", "PNTIntegration.PrimeCountingFromPsi", "PNTIntegration.ExplicitADE", "PNTIntegration.ExplicitRat"]

[[lean_lib]]
name = "Architect"
srcDir = "vendor"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
srcDir = "vendor"

[lean_lib.leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
